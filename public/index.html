function home(){const owned=S.phones.map(r=>[phone(r.id),r]).filter(x=>x[0]);return `<div class="screen">${header()}<div class="tabs"><button data-a="home-mode" data-mode="studio" class="${homeMode==='studio'?'on':''}">Студия</button><button data-a="home-mode" data-mode="growth" class="${homeMode==='growth'?'on':''}">Развитие</button></div>${homeMode==='growth'?tasks():`${incomeHero()}<div class="sectionHead"><h2>Телефоны ${owned.length}/3</h2><button data-a="go-phones">Выбрать</button></div>${owned.length?`<div class="phoneGrid">${owned.map(([p,r])=>phoneTile(p,r)).join('')}</div>`:`<div class="empty"><b>Студия пока пустая</b>Забери первый телефон и начни снимать<button class="primary" data-a="first">Получить iPhone 5</button></div>`}<div class="sectionHead"><h2>Как растёт доход</h2></div><div class="card muted">Каждый ролик приносит лайки, подписчиков и постоянный доход в час. Чем сильнее камера и производительность телефона, тем выше охват. Текущие лайки и аудитория усиливают следующие публикации.</div>`}</div>`}
function studio(){const p=phone(S.activePhone),r=prow(S.activePhone),left=attempts(r),wait=nextCharge(r);if(!p||!r)return `<div class="screen">${header()}${title('СТУДИЯ','Выбери телефон')}<div class="empty"><b>Нет активного телефона</b>Открой список телефонов и выбери устройство.<button class="primary" data-a="go-phones">К телефонам</button></div></div>`;return `<div class="screen">${header()}${title('СЪЁМКА','Студия')}<section class="selectedPhone"><div class="row">${phoneVisual(p,'big')}<div class="phoneInfo"><p>${p.brand}${p.flagship?' · флагман':''}</p><h2>${esc(p.name)}</h2><div class="meter"><label><span>Камера</span><b>${p.cam}%</b></label><div class="track"><i style="width:${p.cam}%"></i></div></div><div class="meter"><label><span>Производительность</span><b>${p.perf}%</b></label><div class="track"><i style="width:${p.perf}%"></i></div></div></div></div><button class="soft" data-a="go-phones" style="width:100%;margin-top:12px">Сменить телефон</button></section><section class="chargePanel"><div class="row"><b>Попытки съёмки</b><span class="countdown" data-countdown>${left<3?'1 попытка через '+clock(wait):'Все готовы'}</span></div><div class="chargeDots">${[0,1,2].map(i=>`<i class="${i<left?'on':''}"></i>`).join('')}</div><p class="muted">У каждого телефона 3 попытки. Каждая использованная попытка вернётся отдельно через 10 минут.</p></section><div class="sectionHead"><h2>Тема ролика</h2></div><div class="topics">${['😂 Юмор','💻 Технологии','🎮 Игры','✨ Лайфстайл','📱 Обзор'].map((x,i)=>`<button class="${S.topic===i?'on':''}" data-a="topic" data-i="${i}">${x}</button>`).join('')}</div><div class="record" id="record"><span>REC</span></div><button class="primary" id="shoot" data-a="shoot" ${r.broken||!left?'disabled':''}>${r.broken?'Сначала починить телефон':left?'Снять видео · '+left+'/3':'Попытки восстанавливаются'}</button>${r.broken?`<button class="soft danger" data-a="repair" data-id="${p.id}" style="width:100%;margin-top:9px">Починить за 20 000 ₽</button>`:''}${lastResult?videoResult(lastResult):''}<div class="sectionHead"><h2>Последние ролики</h2></div>${S.videos.length?S.videos.slice(-4).reverse().map(v=>`<div class="card row"><div><b>${esc(v.title)}</b><p class="muted">${compact(v.likes)} лайков · +${compact(v.subs)} подписчиков</p></div><b>${fmt(v.income)}/ч</b></div>`).join(''):'<div class="empty">Здесь появятся опубликованные видео</div>'}</div>`}function videoResult(x){return `<section class="result"><h3>${x.viral?'🔥 Видео залетело!':'Видео опубликовано'}</h3><div class="resultGrid"><div><small>ЛАЙКИ</small><b>+${compact(x.likes)}</b></div><div><small>ПОДПИСЧИКИ</small><b>+${compact(x.subs)}</b></div><div><small>ДОХОД</small><b>+${fmt(x.income)}/ч</b></div></div></section>`}
function cases(){return `<div class="screen">${header()}${title('МАГАЗИН','Кейсы')}<div class="caseMenu"><button class="caseTile" data-a="go-phones"><span>📱</span><b>Телефоны</b><small>5 брендов, флагманы и улучшение студии</small></button><button class="caseTile" data-a="go-numbers"><span>💎</span><b>Красивые номера</b><small>Бонус охвата, редкость и продажа</small></button></div><div class="card muted">В коллекции можно держать до 3 телефонов и до 5 номеров. SIM устанавливается на выбранный смартфон и повышает охват роликов.</div></div>`}function phones(){const owned=S.phones.map(r=>[phone(r.id),r]).filter(x=>x[0]),c=C.phone_cases[brand];return `<div class="screen">${header()}${title('КОЛЛЕКЦИЯ','Телефоны')}<div class="sectionHead"><h2>Мои устройства ${owned.length}/3</h2><button data-a="go-home">На главную</button></div>${owned.length?`<div class="phoneGrid">${owned.map(([p,r])=>phoneTile(p,r)).join('')}</div>`:'<div class="empty">Нет телефонов</div>'}<div class="sectionHead"><h2>Брендовые кейсы</h2></div><div class="caseRow">${Object.entries(C.phone_cases).map(([k,v])=>`<button class="${brand===k?'on':''}" data-a="brand" data-brand="${k}" style="--pc:${COLORS[k]}"><b>${k}</b><small>${fmt(v.price)}</small></button>`).join('')}</div><div class="caseStage" id="phoneStage" style="--pc:${COLORS[brand]}"><div class="caseBox" id="caseBox">${brand.toUpperCase()}</div></div><button class="primary" data-a="open-phone" ${owned.length>=3?'disabled':''}>${owned.length>=3?'Все 3 слота заняты':'Открыть за '+fmt(c?.price)}</button></div>`}
function phoneDetail(id){const p=phone(id),r=prow(id),n=sim(id);if(!p||!r)return home();return `<div class="screen">${header()}<button class="link" data-a="go-phones">← Все телефоны</button>${title(p.brand,esc(p.name))}<section class="selectedPhone"><div class="row">${phoneVisual(p,'big')}<div class="phoneInfo"><h2>${p.cam}% камера</h2><p>${p.perf}% производительность</p><p>${attempts(r)}/3 попытки · ${r.broken?'нужен ремонт':'исправен'}</p><p>${n?'SIM '+formatNumber(n.digits)+' · +'+n.boost+'%':'SIM не установлена'}</p></div></div><button class="primary" data-a="select-phone" data-id="${p.id}">${S.activePhone===p.id?'Телефон выбран':'Выбрать для съёмки'}</button>${r.broken?`<button class="soft danger" data-a="repair" data-id="${p.id}" style="width:100%;margin-top:9px">Починить за 20 000 ₽</button>`:''}</section><section class="card"><h3>Установить номер</h3>${S.numbers.length?S.numbers.map(x=>`<div class="task row"><div><b>${formatNumber(x.digits)}</b><small>+${x.boost}% к охвату</small></div><button class="soft" data-a="attach-number" data-phone="${p.id}" data-number="${x.id}">${x.phoneId===p.id?'Установлен':'Поставить'}</button></div>`).join(''):'<p class="muted">Сначала получи номер в кейсе.</p>'}</section><button class="soft danger" style="width:100%;margin-top:12px" data-a="sell-phone" data-id="${p.id}">Продать за ${fmt(p.value*.42)}</button></div>`}
function numbers(){const c=C.number_cases[numCase];return `<div class="screen">${header()}${title('SIM-КОЛЛЕКЦИЯ','Красивые номера')}<div class="tabs"><button data-a="num-mode" data-mode="open" class="${numberMode==='open'?'on':''}">Открыть кейс</button><button data-a="num-mode" data-mode="mine" class="${numberMode==='mine'?'on':''}">Мои ${S.numbers.length}/5</button></div>${numberMode==='mine'?numberCollection():`<div class="caseRow">${[['simple','Простой'],['pretty','Красивый'],['business','Бизнес']].map(([k,n])=>`<button class="${numCase===k?'on':''}" data-a="num-case" data-key="${k}" style="--pc:${RAR[k==='simple'?1:k==='pretty'?2:3][1]}"><b>${n}</b><small>${fmt(C.number_cases[k].price)}</small></button>`).join('')}</div><div class="numberCard" id="numStage" style="--rc:${RAR[numCase==='simple'?1:numCase==='pretty'?2:3][1]}"><div class="rarity">VIRAL SIM</div><div class="digits" style="margin-top:35px">+7 XXX XXX XX XX</div><div class="numberWhy" style="margin-top:30px">Шанс окупить кейс — около 30%. Продажа игре возвращает 40% оценки номера.</div></div><button class="primary" data-a="open-number" ${S.numbers.length>=5?'disabled':''}>${S.numbers.length>=5?'Лимит 5 номеров':'Сгенерировать за '+fmt(c.price)}</button><div class="odds">${CASE_ODDS[numCase]}</div>`}</div>`}function numberCollection(){return S.numbers.length?S.numbers.map(n=>`<div class="numberCard" style="--rc:${RAR[n.rarity][1]}"><div class="rarity">${RAR[n.rarity][0].toUpperCase()}</div><div class="digits">${formatNumber(n.digits)}</div><div class="numberWhy">${numberWhy(n)}. Оценка ${fmt(n.value)}, продажа игре ${fmt(n.value*.4)}.${n.phoneId?' Установлен на '+esc(phone(n.phoneId)?.name||n.phoneId)+'.':''}</div><button class="soft danger" style="width:100%;margin-top:11px" data-a="sell-number" data-id="${n.id}">Продать за ${fmt(n.value*.4)}</button></div>`).join(''):'<div class="empty"><b>Номеров пока нет</b>Открой первый кейс</div>'}function formatNumber(s){s=String(s);return '+7 '+s.slice(0,3)+' '+s.slice(3,6)+' '+s.slice(6,8)+' '+s.slice(8)}function numberWhy(n){return ['Обычная комбинация для старта','Редкие повторения легче запоминаются','Выраженный цифровой узор','Коллекционная серия с высокой ценностью','Уникальный секретный паттерн'][n.rarity]+' · бонус охвата +'+n.boost+'%'}
function menu(){return `<div class="screen">${header()}${title('АККАУНТ','Меню')}<div class="menu"><button data-a="profile"><span>◉</span><b>Профиль</b><small>Статистика и никнейм</small></button><button data-a="go-numbers"><span>✦</span><b>Мои номера</b><small>Коллекция SIM</small></button><button data-a="help"><span>?</span><b>Как играть</b><small>Коротко о механиках</small></button>${S.isAdmin?'<button data-a="admin"><span>⚙</span><b>Админ-панель</b><small>Игроки и экономика</small></button>':''}</div></div>`}function profile(){return `<div class="screen">${header()}${title('ПРОФИЛЬ',esc(S.name||'Новый автор'))}<div class="statGrid"><div class="stat"><small>Подписчики</small><b>${compact(S.subs)}</b></div><div class="stat"><small>Лайки</small><b>${compact(S.likes)}</b></div><div class="stat"><small>Уровень</small><b>${S.level}</b></div><div class="stat"><small>Видео</small><b>${S.videos.length}</b></div></div><section class="card"><h3>Имя автора</h3><label class="field"><input id="nickname" maxlength="18" value="${esc(S.name)}" placeholder="От 3 до 18 символов"></label><button class="primary" data-a="save-name">Сохранить</button></section><button class="soft danger" style="width:100%;margin-top:12px" data-a="reset">Сбросить прогресс</button></div>`}function help(){return `<div class="screen">${header()}${title('ПОМОЩЬ','Как играть')}<section class="card"><h3>1. Снимай</h3><p class="muted">Выбери телефон и тему. На каждом телефоне 3 попытки, каждая возвращается через 10 минут.</p></section><section class="card"><h3>2. Расти</h3><p class="muted">Камера и мощность повышают охват. Текущие лайки и подписчики усиливают будущие ролики.</p></section><section class="card"><h3>3. Зарабатывай</h3><p class="muted">Каждый ролик добавляет постоянный доход в час. Забирай накопления не реже чем раз в ${S.incomeCapHours||4} часа.</p></section><section class="card"><h3>4. Улучшай студию</h3><p class="muted">Открывай кейсы с телефонами и номерами. SIM даёт дополнительный процент к охвату.</p></section></div>`}
function admin(){return `<div class="screen">${header()}${title('ВЛАДЕЛЕЦ · ID 1181838335','Админ-панель')}<div id="adminData"><div class="empty">Загружаем данные…</div></div></div>`}async function loadAdmin(){try{const a=await api('/api/admin');$('#adminData').innerHTML=`<div class="statGrid"><div class="stat"><small>Игроки</small><b>${a.users}</b></div><div class="stat"><small>Активны 24 ч</small><b>${a.activeToday}</b></div><div class="stat"><small>Новые сегодня</small><b>${a.newToday}</b></div><div class="stat"><small>Видео</small><b>${compact(a.videos)}</b></div><div class="stat"><small>Телефоны</small><b>${a.phones}</b></div><div class="stat"><small>Номера</small><b>${a.numbers}</b></div><div class="stat wide"><small>Деньги в обороте</small><b>${fmt(a.balance)}</b></div></div><section class="card"><h3>Управление игроком</h3><label class="field"><span>TELEGRAM ID</span><input id="adId" type="number" placeholder="Например 123456789"></label><button class="primary" data-a="admin-find">Найти игрока</button><div id="adminPlayer"></div></section><section class="card"><h3>Экономика</h3>${setting('income_multiplier','Множитель дохода',a.settings.income_multiplier,.25,3,.05)}${setting('case_payout_multiplier','Оценка номеров',a.settings.case_payout_multiplier,.25,3,.05)}${setting('income_cap_hours','Лимит накопления, часы',a.settings.income_cap_hours,1,24,1)}</section><section class="card"><h3>Журнал действий</h3>${a.audit.length?a.audit.map(x=>`<div class="audit"><b>${esc(x.action)}${x.target_id?' · '+x.target_id:''}</b><span>${esc(x.details||'Без комментария')} · ${new Date(x.created_at*1000).toLocaleString('ru-RU')}</span></div>`).join(''):'<p class="muted">Действий пока нет.</p>'}</section>`}catch(e){toast(e.message)}}function setting(key,label,value,min,max,step){return `<label class="field"><span>${label.toUpperCase()}</span><input id="set-${key}" type="number" min="${min}" max="${max}" step="${step}" value="${value}"></label><button class="soft" style="width:100%;margin-top:7px" data-a="admin-setting" data-key="${key}">Сохранить</button>`}function renderAdminPlayer(u){adminPlayer=u;$('#adminPlayer').innerHTML=`<div class="card" style="background:#101217"><div class="row"><div><b>${esc(u.name||u.telegramName||'Без имени')}</b><p class="muted">ID ${u.id} · ${u.blocked?'ЗАБЛОКИРОВАН':'активен'}</p></div><span class="badge">${u.phones} 📱 · ${u.videos} 🎬</span></div><div class="statGrid" style="margin-top:10px"><div class="stat"><small>Баланс</small><b>${compact(u.balance)}</b></div><div class="stat"><small>XP</small><b>${compact(u.xp)}</b></div><div class="stat"><small>Подписчики</small><b>${compact(u.subscribers)}</b></div><div class="stat"><small>Лайки</small><b>${compact(u.likes)}</b></div></div><label class="field"><span>ПАРАМЕТР</span><select id="adField"><option value="balance">Баланс</option><option value="subscribers">Подписчики</option><option value="likes">Лайки</option><option value="xp">XP</option></select></label><label class="field"><span>ИЗМЕНЕНИЕ, МОЖНО С МИНУСОМ</span><input id="adAmount" type="number" placeholder="Например 50000 или -1000"></label><button class="primary" data-a="admin-adjust">Применить</button><div class="adminActions"><button class="soft" data-a="admin-reset-attempts">Вернуть попытки</button><button class="soft ${u.blocked?'green':'danger'}" data-a="admin-block" data-blocked="${u.blocked?'0':'1'}">${u.blocked?'Разблокировать':'Заблокировать'}</button></div></div>`}
function render(){let html;if(tab==='home')html=home();else if(tab==='studio')html=studio();else if(tab==='cases')html=cases();else if(tab==='phones')html=phones();else if(tab==='numbers')html=numbers();else if(tab==='phoneDetail')html=phoneDetail(render.phoneId);else if(tab==='menu')html=menu();else if(tab==='profile')html=profile();else if(tab==='help')html=help();else if(tab==='admin')html=admin();$('#view').innerHTML=html;$('#view').scrollTop=0;renderNav();if(tab==='admin')loadAdmin();requestAnimationFrame(showTutorial)}function renderNav(){const active=['phones','numbers','phoneDetail'].includes(tab)?'cases':['profile','help','admin'].includes(tab)?'menu':tab;$('#nav').innerHTML=[['home','⌂','Главная'],['studio','●','Студия'],['cases','◇','Кейсы'],['menu','☰','Меню']].map(([k,i,t])=>`<button data-a="tab" data-tab="${k}" class="${active===k?'on':''}"><i>${i}</i>${t}</button>`).join('')}async function shoot(){if(busy)return;busy=true;$('#record')?.classList.add('loading');$('#shoot').disabled=true;try{const x=await action('shoot');await new Promise(r=>setTimeout(r,650));lastResult=x;render();toast(x.viral?'🔥 Ролик залетел!':'Видео опубликовано')}catch(e){toast(e.message);render()}finally{busy=false}}async function openPhone(){if(busy)return;busy=true;$('#caseBox')?.classList.add('opening');try{const x=await action('open_phone_case',{brand});await new Promise(r=>setTimeout(r,1420));const p=phone(x.phone_id),stage=$('#phoneStage');stage.innerHTML=`<div class="drop">${phoneVisual(p,'big')}<h3>${esc(p.name)}</h3><p>Камера ${p.cam}% · мощность ${p.perf}%</p></div>`;try{tg?.HapticFeedback?.notificationOccurred('success')}catch(e){}setTimeout(()=>{busy=false;render()},1800)}catch(e){busy=false;toast(e.message);render()}}async function openNumber(){if(busy)return;busy=true;const stage=$('#numStage');stage.innerHTML='<div class="rarity">ПОИСК КОМБИНАЦИИ</div><div class="digits" id="rolling" style="margin-top:35px">+7 900 000 00 00</div><div class="numberWhy" style="margin-top:30px">Проверяем редкость и рыночную оценку…</div>';let timer=setInterval(()=>{const s='9'+Array.from({length:9},()=>Math.floor(Math.random()*10)).join('');if($('#rolling'))$('#rolling').textContent=formatNumber(s)},70);try{const x=await action('generate_number',{case:numCase});await new Promise(r=>setTimeout(r,900));clearInterval(timer);const n=S.numbers.find(v=>String(v.id)===String(x.number_id));stage.style.setProperty('--rc',RAR[n.rarity][1]);stage.innerHTML=`<div class="rarity">${RAR[n.rarity][0].toUpperCase()}</div><div class="digits">${formatNumber(n.digits)}</div><div class="numberWhy">${numberWhy(n)}. Продажа ${fmt(x.sell_amount)}. ${x.sell_amount>=x.case_price?'Этот номер окупил кейс!':'Этот номер не окупил кейс.'}</div><button class="soft danger" style="width:100%;margin-top:12px" data-a="sell-number" data-id="${n.id}">Продать за ${fmt(x.sell_amount)}</button>`;busy=false;toast('Номер добавлен в коллекцию')}catch(e){clearInterval(timer);busy=false;toast(e.message);render()}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset,a=d.a,tut=TUTORIAL[S.tutorial];if(tut&&a!==tut.action&&a!=='finish-tutorial')return;try{if(a==='tab'){tab=d.tab;lastResult=null;render()}else if(a==='home-mode'){homeMode=d.mode;render()}else if(a==='go-home'){tab='home';render()}else if(a==='go-phones'){tab='phones';render()}else if(a==='go-numbers'){tab='numbers';render()}else if(a==='phone-detail'){render.phoneId=d.id;tab='phoneDetail';render()}else if(a==='first'){await action('claim_starter');tab='phones';render()}else if(a==='repair'){await action('repair',{phone_id:d.id});render();toast('Телефон готов')}else if(a==='select-phone'){await action('select_phone',{phone_id:d.id});tab='studio';render();toast('Телефон выбран')}else if(a==='claim'){const x=await action('claim_income');render();toast('Получено '+fmt(x.amount))}else if(a==='topic'){await action('set_topic',{topic:+d.i});render()}else if(a==='shoot')shoot();else if(a==='brand'){brand=d.brand;render()}else if(a==='open-phone')openPhone();else if(a==='num-mode'){numberMode=d.mode;render()}else if(a==='num-case'){numCase=d.key;render()}else if(a==='open-number')openNumber();else if(a==='attach-number'){await action('attach_number',{phone_id:d.phone,number_id:d.number});render();toast('SIM установлена')}else if(a==='sell-number'){const n=S.numbers.find(x=>String(x.id)===String(d.id));if(n&&confirm(`Продать ${formatNumber(n.digits)} за ${fmt(n.value*.4)}?`)){await action('sell_number',{number_id:n.id});render();toast('Номер продан')}}else if(a==='sell-phone'){const p=phone(d.id);if(confirm(`Продать ${p.name} за ${fmt(p.value*.42)}?`)){await action('sell_phone',{phone_id:d.id});tab='home';render();toast('Телефон продан')}}else if(a==='daily'){const x=await action('claim_daily',{task:d.task});render();toast('Награда '+fmt(x.amount))}else if(a==='level'){const x=await action('claim_level',{level:+d.level});render();toast('Награда '+fmt(x.amount))}else if(a==='profile'){tab='profile';render()}else if(a==='help'){tab='help';render()}else if(a==='admin'){tab='admin';render()}else if(a==='save-name'){await action('save_name',{name:$('#nickname').value.trim()});render();toast('Имя сохранено')}else if(a==='reset'){if(confirm('Удалить весь прогресс без возможности восстановления?')){await action('reset');tab='home';render()}}else if(a==='admin-find'){renderAdminPlayer(await api('/api/admin/player/'+Number($('#adId').value)))}else if(a==='admin-adjust'){await action('admin_adjust',{user_id:adminPlayer.id,field:$('#adField').value,amount:Number($('#adAmount').value)});renderAdminPlayer(await api('/api/admin/player/'+adminPlayer.id));toast('Изменение применено')}else if(a==='admin-block'){await action('admin_block',{user_id:adminPlayer.id,blocked:d.blocked==='1'});renderAdminPlayer(await api('/api/admin/player/'+adminPlayer.id));toast('Статус изменён')}else if(a==='admin-reset-attempts'){await action('admin_reset_attempts',{user_id:adminPlayer.id});toast('Попытки восстановлены')}else if(a==='admin-setting'){await action('admin_setting',{key:d.key,value:Number($('#set-'+d.key).value)});toast('Настройка сохранена')}else if(a==='finish-tutorial'){await action('finish_tutorial');render()}}catch(err){toast(err.message)}});
const TUTORIAL=[{tab:'home',action:'first',q:'[data-a="first"]',h:'Получи первый телефон',p:'Это твой стартовый смартфон. Нажми кнопку, чтобы добавить его в студию.'},{tab:'phoneDetail',action:'repair',q:'[data-a="repair"]',h:'Подготовь телефон',p:'Стартовый телефон требует ремонта. После этого он сможет снимать ролики.'},{tab:'profile',action:'save-name',q:'[data-a="save-name"]',h:'Придумай имя',p:'Сохрани никнейм автора. Его всегда можно изменить в профиле.'},{tab:'phoneDetail',action:'select-phone',q:'[data-a="select-phone"]',h:'Выбери телефон',p:'Камера и производительность напрямую влияют на лайки и подписчиков.'},{tab:'studio',action:'shoot',q:'[data-a="shoot"]',h:'Сними первое видео',p:'На телефоне 3 попытки. Каждая вернётся отдельно через 10 минут.'},{tab:'home',action:'finish-tutorial',q:null,h:'Студия готова',p:'Забирай доход, улучшай телефоны и выполняй ежедневные задания.'}];function clearTutorial(){document.querySelector('#tutorialShade')?.remove();document.querySelector('#tutorialTip')?.remove();$$('.tutorialTarget').forEach(x=>x.classList.remove('tutorialTarget'))}function showTutorial(){clearTutorial();const t=TUTORIAL[S.tutorial];if(!t)return;if(tab!==t.tab){if(t.tab==='phoneDetail'){const id=S.activePhone||S.phones[0]?.id;if(!id)return;render.phoneId=id}tab=t.tab;render();return}const target=t.q&&$(t.q,$('#view')),shade=document.createElement('div');shade.id='tutorialShade';$('#app').append(shade);if(target){target.classList.add('tutorialTarget');target.scrollIntoView({block:'center'})}const tip=document.createElement('aside');tip.id='tutorialTip';tip.innerHTML=`<small>ОБУЧЕНИЕ · ${S.tutorial+1}/${TUTORIAL.length}</small><b>${t.h}</b><p>${t.p}</p>${t.q?'':'<button class="primary" data-a="finish-tutorial">Начать играть</button>'}`;$('#app').append(tip)}setInterval(()=>{if(!S)return;const el=$('[data-countdown]');if(!el)return;const r=prow(S.activePhone),left=attempts(r),wait=nextCharge(r);el.textContent=left<3?'1 попытка через '+clock(wait):'Все готовы';if(wait===0&&left<3)render()},1000);async function init(){try{const [st,cat]=await Promise.all([api('/api/state'),api('/api/catalog')]);S=st.state;C={phones:cat.phones.map(p=>({...p,n:p.name,p:p.value})),phone_cases:cat.phone_cases,number_cases:cat.number_cases};render();setTimeout(()=>$('#splash').classList.add('hide'),250)}catch(e){$('#view').innerHTML=`<div class="screen"><div class="empty" style="margin-top:35vh"><b>Не удалось войти</b>${esc(e.message)}<button class="primary" onclick="location.reload()">Повторить</button></div></div>`;$('#nav').innerHTML='';$('#splash').classList.add('hide')}}init();
</script><style>#tutorialShade{pointer-events:none}.tutorialTarget{box-shadow:0 0 0 3px #9b86ff,0 0 0 9999px #000c,0 0 28px #8b71ff!important}@keyframes targetPulse{to{box-shadow:0 0 0 5px #9b86ff,0 0 0 9999px #000c,0 0 30px #8b71ff!important}}</style></body></html>
