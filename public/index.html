<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050507">
  <title>Viral Life</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app" id="app">
    <section class="splash" id="splash">
      <div class="splash-orbit"><div class="splash-logo">V</div></div>
      <h1>VIRAL <span>LIFE</span></h1>
      <p>Твоя история начинается</p>
      <div class="splash-line"><i></i></div>
    </section>
    <div class="toast" id="toast"></div>
    <section class="view" id="view"></section>
    <nav class="nav" id="nav"></nav>
    <section class="modal-layer" id="modal"></section>
    <section class="tutorial" id="tutorial">
      <div class="tutorial-shade"></div>
      <div class="tutorial-focus" id="tutorialFocus"></div>
      <div class="coach" id="coach"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
