<style>

.view>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}

.top{display:flex;align-items:center;justify-content:space-between}

.bal{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:16px;font-weight:800;font-size:15px;background:linear-gradient(145deg,#26252e,#14131a);border:1px solid var(--ln)}

.hd{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 22px}

.sub{color:var(--mut);font-size:14px;line-height:1.5;margin-top:10px}
.bdg{width:44px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:900;color:#2a1c00;background:linear-gradient(145deg,#ffd978,#c58a1d);box-shadow:0 6px 20px #e8b03a44}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:24px;border:1px solid var(--ln);background:rgba(255,255,255,.03);margin-bottom:14px}

.cs3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.cs{text-align:left;padding:34px 12px 12px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(160deg,var(--c1),rgba(0,0,0,.2) 55%);transition:.3s}

.sim{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 22px;height:208px;background:linear-gradient(160deg,#16151d,#08080c 60%);border:1px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 30%,transparent),inset 0 0 40px color-mix(in srgb,var(--rc) 14%,transparent);transition:box-shadow .5s,border-color .5s}

.sr span:last-child{color:var(--pur)}
.chip{position:relative;width:52px;height:40px;margin:16px 0 14px;border-radius:10px;background:linear-gradient(145deg,#ffe08c,#b8801a);box-shadow:inset 0 0 0 2px #00000022;overflow:hidden}

.sf span:first-child{color:var(--rc);letter-spacing:.1em}.sf span:last-child{color:#aaa7bb}

.go{width:100%;margin-top:18px;display:flex;justify-content:space-between;align-items:center;padding:22px 20px;border-radius:24px;font-weight:900;font-size:17px;background:linear-gradient(100deg,#3b2a8c,#7b4ae0 55%,#d0529a);box-shadow:0 10px 36px #7b4ae055;transition:.25s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

.pill:disabled{opacity:.35}
.ln{font-size:13px;color:#c9c6d6;padding:8px 0;border-top:1px solid #ffffff10}.ln:first-of-type{border:0}

input:focus{border-color:var(--pur)}
.rec{display:grid;place-items:center;width:100px;height:100px;margin:18px auto 6px;border-radius:50%;border:2px solid #ff4d6d;color:#ff4d6d;font-size:30px}

nav{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:30px;background:rgba(18,16,26,.82);backdrop-filter:blur(18px);border:1px solid var(--ln);z-index:5}

#sp{position:absolute;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:12px;background:#050507;transition:opacity .6s .1s,visibility .7s}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}}

.z.on i{opacity:1}.z.hit{animation:zh .8s cubic-bezier(.2,1.6,.3,1)}

body.tg .app{border:0;border-radius:0;margin:0;height:100dvh}

.phcard{position:relative;overflow:hidden;padding:18px;border-radius:28px;margin-top:12px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.17);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.36),0 14px 40px -12px #000;backdrop-filter:blur(26px) saturate(180%)}

.phbrand{font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--pc);margin-bottom:5px}.phcard h2{font-size:20px;letter-spacing:-.025em}.phstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.phstat{font-size:9px;color:var(--mut)}.phbar{height:4px;border-radius:4px;background:#ffffff12;margin-top:5px;overflow:hidden}.phbar i{display:block;height:100%;background:var(--pc);box-shadow:0 0 8px var(--pc);border-radius:4px}.phactions{display:flex;gap:7px;align-items:center}.phactions .pill{flex:1}.phflag{display:inline-block;padding:4px 7px;border-radius:9px;background:#ffc94d18;border:1px solid #ffc94d44;color:#ffd87d;font-size:8px;font-weight:900;margin-top:6px}
.phvisual{position:absolute;right:18px;top:22px;width:54px;height:103px;border-radius:14px;transform:perspective(500px) rotateY(-27deg) rotateZ(-7deg);background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 65%,#ddd),color-mix(in srgb,var(--pc) 38%,#09090d));border:1px solid #ffffff44;box-shadow:inset 2px 2px #ffffff22,10px 16px 24px #0009}.phvisual:before{content:"";position:absolute;left:6px;top:7px;width:21px;height:28px;border-radius:8px;background:#07070a;border:1px solid #ffffff2e;box-shadow:inset 0 0 8px var(--pc)}.phvisual:after{content:"";position:absolute;left:10px;top:11px;width:7px;height:7px;border-radius:50%;background:#233b5e;box-shadow:10px 0 #233b5e,0 11px #233b5e}
.cases5{display:flex;gap:9px;overflow-x:auto;padding:5px 1px 15px;scrollbar-width:none}.cases5::-webkit-scrollbar{display:none}.pcase{min-width:124px;text-align:left;padding:16px 12px;border-radius:22px;background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 24%,#181620),rgba(255,255,255,.04));border:1px solid #ffffff18;transition:.35s}.pcase.on{transform:translateY(-3px);border-color:var(--pc);box-shadow:0 0 24px color-mix(in srgb,var(--pc) 35%,transparent)}.pcase b,.pcase span,.pcase small{display:block}.pcase span{font-weight:900;margin-top:15px}.pcase small{font-size:9px;color:var(--mut);margin-top:4px}
.dropzone{height:230px;border-radius:30px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle,color-mix(in srgb,var(--pc) 30%,transparent),transparent 54%),linear-gradient(145deg,#17151f,#08080c);border:1px solid #ffffff18}.dropbox{width:108px;height:91px;border-radius:23px;background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 72%,#292631),#111018);border:1px solid #ffffff42;box-shadow:inset 0 2px #ffffff55,0 24px 45px #000a,0 0 42px color-mix(in srgb,var(--pc) 45%,transparent);display:grid;place-items:center;font-weight:900;letter-spacing:.12em;animation:casefloat 4s ease-in-out infinite}.dropbox.open{animation:caseopen 2.4s cubic-bezier(.2,.9,.3,1) both}.dropresult{position:absolute;text-align:center;opacity:0;transform:translateY(35px) scale(.7);transition:.8s cubic-bezier(.2,1.5,.3,1)}.dropresult.on{opacity:1;transform:none}.dropresult b{display:block;font-size:19px}.dropresult small{color:var(--mut)}
@keyframes casefloat{50%{transform:translateY(-7px) rotateY(8deg)}}@keyframes caseopen{20%{transform:scale(.86) rotate(-5deg)}65%{transform:scale(1.18) rotate(5deg);filter:brightness(2)}100%{transform:scale(.08);opacity:0;filter:brightness(5)}}
.tut{position:absolute;inset:0;z-index:50;display:none;pointer-events:none}.tut.on{display:block}.tutfocus{position:absolute;border-radius:24px;box-shadow:0 0 0 900px rgba(0,0,0,.82),0 0 0 2px #ffffffaa,0 0 30px #a77bff;transition:left .52s cubic-bezier(.22,1,.36,1),top .52s cubic-bezier(.22,1,.36,1),width .52s,height .52s}.tutcoach{position:absolute;left:15px;right:15px;padding:16px;border-radius:24px;background:linear-gradient(145deg,rgba(50,47,65,.96),rgba(19,18,26,.96));border:1px solid #ffffff25;box-shadow:inset 0 1.5px #ffffff4d,0 16px 45px #000c;transition:top .52s cubic-bezier(.22,1,.36,1)}.tutcoach b{font-size:14px}.tutcoach p{font-size:12px;line-height:1.45;color:#b0acbe;margin-top:5px}.tutcoach button{width:100%;margin-top:11px;padding:12px;border-radius:15px;background:linear-gradient(100deg,#6843d2,#c3519d);font-weight:800;pointer-events:auto}

<body>
<div class="app" id="app">
  <div id="sp"><div class="v">V</div><b>VIRAL LIFE</b><small>Создаём твою историю</small></div>
  <div id="ts"></div>
  <div class="view" id="vw"></div>
  <nav id="nv"></nav>
  <div class="tut" id="tut"><div class="tutfocus" id="tutfocus"></div><div class="tutcoach" id="tutcoach"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
let PH=[];
const PCOL={Starter:'#a8a9ad',POCO:'#f5d72a',Xiaomi:'#ff7a2f',Pixel:'#70d0a1',Samsung:'#5c94ff',iPhone:'#d4b7ff'};
const PCASE={POCO:{p:65000,c:'#f5d72a'},Xiaomi:{p:105000,c:'#ff7a2f'},Pixel:{p:145000,c:'#70d0a1'},Samsung:{p:210000,c:'#5c94ff'},iPhone:{p:295000,c:'#d4b7ff'}};
const CS={s:{n:'Простой',p:15000,d:'любой паттерн',k:'ПРОСТОЙ КЕЙС',c:['#10243a','#4da3ff','#4da3ff33'],w:[.7,.24,.05,.01]},
 n:{n:'Красивый',p:75000,d:'пары и серии',k:'КРАСИВЫЙ КЕЙС',c:['#221238','#a77bff','#a77bff33'],w:[.35,.4,.2,.05]},
 b:{n:'Бизнес',p:350000,d:'редкие комбинации',k:'БИЗНЕС-КЕЙС',c:['#2b2108','#f3c453','#f3c45333'],w:[.1,.3,.45,.15]}};
const RR=[['Обычный','#8f95a8',[.3,.7]],['Редкий','#4da3ff',[.8,1.6]],['Эпический','#b07cff',[1.8,3.5]],['Легендарный','#ffc94d',[5,12]],['Секретный','#ff557b',[15,30]]];
let S={cash:50000,subs:0,likes:0,vids:[],phone:null,have:[],phoneRows:[],nums:[],name:'',pool:0,tutorial:0,topic:0,log:['Твоя история только начинается']};
let tab='home',mode='gen',ck='s',busy=false,last=null,phoneCase='POCO',configPhone=null;
const save=()=>{};
const initData=()=>window.Telegram&&Telegram.WebApp?Telegram.WebApp.initData||'':'';
async function api(path,opt={}){let r;try{r=await fetch(path,{...opt,headers:{'content-type':'application/json','X-Telegram-Init-Data':initData(),...(opt.headers||{})}})}catch(e){throw Error('Нет связи с Python-сервером')}const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(`Python API не запущен: HTTP ${r.status}`)}if(!r.ok||d.ok===false)throw Error(d.detail||`Ошибка API: HTTP ${r.status}`);return d}
function applyState(x){const oldlog=S.log||[];S={cash:x.cash,subs:x.subs,likes:x.likes,name:x.name||'',pool:x.pool,phone:x.activePhone,have:x.phones.map(p=>p.id),phoneRows:x.phones,nums:x.numbers.map(n=>({id:n.id,d:n.digits,r:n.rarity,v:n.value,boost:n.boost,phoneId:n.phoneId})),vids:x.videos.map(v=>({t:v.title,l:v.likes,r:v.income,subs:v.subs,viral:v.viral})),tutorial:x.tutorial,topic:x.topic,log:oldlog.length?oldlog:['Твоя история только начинается']}}
async function action(a,payload={}){const d=await api('/api/action',{method:'POST',body:JSON.stringify({action:a,payload})});applyState(d.state);return d.result}
const rate=()=>S.vids.reduce((a,v)=>a+v.r,0);
const ph=()=>PH.find(p=>p.id===S.phone);
const prow=id=>S.phoneRows.find(p=>p.id===id);
function attempts(row){if(!row)return 0;const cut=Date.now()-1800000;row.uses=(row.uses||[]).filter(t=>t>cut);return Math.max(0,3-row.uses.length)}
function numOn(id){return S.nums.find(n=>n.phoneId===id)}
const log=t=>{S.log.unshift(t);S.log=S.log.slice(0,5)};
let tt;function toast(t){const e=$('#ts');e.textContent='✓ '+t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function head(){return `<div class="top"><div class="ava">${(S.name||'?')[0].toUpperCase()}<i></i></div><div class="logo">VIRAL <b>LIFE</b></div><div class="bal" id="bal"><i>₽</i><span id="bv">${Math.round(S.cash).toLocaleString('ru-RU')}</span></div></div>`}
function money(){$('#bv').textContent=Math.round(S.cash).toLocaleString('ru-RU');const b=$('#bal');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');save()}
/* views */
const V={
home(){return head()+`<div class="eb">${S.vids.length?'СЕГОДНЯ':'ТВОЙ НОВЫЙ СТАРТ'}</div><div class="hd"><h1>${S.vids.length?'Продвигай<br><em>свой канал</em>':'Сними первое <em>вирусное видео</em>'}</h1></div>
${S.phone?'':`<p class="sub">Старый телефон. Ноль подписчиков. Миллион возможностей.</p><button class="go" data-a="first"><span>Получить первый телефон</span><small>→</small></button>`}
<div class="grid2"><div class="st"><span>Подписчики</span><b>${f2(S.subs)}</b><small>${S.vids.length?'Растём':'Начни с первого ролика'}</small></div><div class="st"><span>Всего лайков</span><b>${f2(S.likes)}</b><small>10 ₽ за лайк</small></div><div class="st"><span>Видео</span><b>${S.vids.length}</b><small>Опубликовано</small></div><div class="st"><span>Доход / час</span><b id="rt">${f(rate())}</b><small>С активных видео</small></div></div>
<div class="card row"><div><span style="font-size:11px;color:var(--mut)">Накопленная прибыль</span><b style="display:block;font-size:22px" id="pl">${f(S.pool)}</b></div><button class="pill" data-a="claim">Забрать</button></div>
<div class="card"><div class="row"><h3>ПОСЛЕДНИЕ СОБЫТИЯ</h3><span class="live">LIVE</span></div>${S.log.map(l=>`<div class="ln">✦ ${l}</div>`).join('')}</div>`},
studio(){const p=ph(),row=prow(S.phone),n=numOn(S.phone),left=attempts(row);return head()+`<div class="eb">СТУДИЯ</div><div class="hd"><h1>Создать видео</h1></div>
<div class="card"><h3>НИКНЕЙМ</h3><div class="row"><input id="nm" maxlength="14" placeholder="Придумай ник" value="${S.name}"><button class="pill" data-a="name">Ок</button></div></div>
${p?`<div class="phcard on" style="--pc:${PCOL[p.brand]}"><div class="phbrand">${p.brand.toUpperCase()}</div><h2>${p.n}</h2><div class="phstats"><div class="phstat">Камера ${p.cam}%<div class="phbar"><i style="width:${p.cam}%"></i></div></div><div class="phstat">Мощность ${p.perf}%<div class="phbar"><i style="width:${p.perf}%"></i></div></div></div><div class="sub" style="margin:0">${n?'SIM '+fmt(n.d)+' · +'+n.boost+'% охвата':'Номер не установлен'} · попыток ${left}/3</div><div class="phvisual"></div></div>`:'<div class="card sub">Сначала получи телефон</div>'}
<div class="rec" id="rec">●</div><button class="go" data-a="shoot" id="sh" ${p&&row&&!row.broken&&left?'':'disabled'}><span>${row&&row.broken?'Телефон сломан':left?'Снять новое видео':'Лимит 3/3'}</span><small>●</small></button>
<div class="card"><h3>МОИ ВИДЕО · ${S.vids.length}</h3>${S.vids.length?S.vids.slice(-6).reverse().map(v=>`<div class="ln row"><span>▶ ${v.t}</span><b>${f2(v.l)} ♥</b></div>`).join(''):'<div class="ln">Здесь появятся твои ролики</div>'}</div>`},
phones(){const owned=S.phoneRows.map(r=>({p:PH.find(x=>x.id===r.id),r})).filter(x=>x.p);const c=PCASE[phoneCase];return head()+`<div class="eb">ТЕХНИКА · ${owned.length}/3</div><div class="hd"><h1>Мои телефоны</h1></div>${owned.length?owned.map(({p,r})=>`<div class="phcard ${S.phone===p.id?'on':''}" style="--pc:${PCOL[p.brand]}"><div class="phbrand">${p.brand.toUpperCase()}</div><h2>${p.n}</h2>${p.flagship?'<span class="phflag">ФЛАГМАН</span>':''}<div class="phstats"><div class="phstat">Камера ${p.cam}%<div class="phbar"><i style="width:${p.cam}%"></i></div></div><div class="phstat">Мощность ${p.perf}%<div class="phbar"><i style="width:${p.perf}%"></i></div></div></div><div class="sub" style="margin:0 0 10px">Попыток ${attempts(r)}/3 ${numOn(p.id)?'· SIM +'+numOn(p.id).boost+'%':'· без номера'}</div><div class="phactions"><button class="pill" data-a="ph" data-id="${p.id}">${S.phone===p.id?'Выбран':'Выбрать'}</button><button class="pill" data-a="phone-menu" data-id="${p.id}">Настроить</button></div>${configPhone===p.id?`<div class="card" style="margin-top:10px"><h3>УСТАНОВИТЬ SIM</h3>${S.nums.length?S.nums.map(n=>`<button class="ln row" style="width:100%;color:#fff;background:none;border:0" data-a="attach-number" data-phone="${p.id}" data-number="${n.id}"><span>${fmt(n.d)}</span><b style="color:${RR[n.r][1]}">+${n.boost}%</b></button>`).join(''):'<div class="ln">Сначала получи номер</div>'}</div>`:''}${r.broken?`<button class="go" data-a="repair" data-id="${p.id}" style="margin-top:10px;padding:15px"><span>Починить телефон</span><small>${f(20000)}</small></button>`:''}<div class="phvisual"></div></div>`).join(''):'<div class="card sub">Получи первый телефон на главной</div>'}
<div class="eb">БРЕНДОВЫЕ КЕЙСЫ</div><div class="cases5">${Object.entries(PCASE).map(([k,x])=>`<button class="pcase ${k===phoneCase?'on':''}" data-a="pcase" data-brand="${k}" style="--pc:${x.c}"><b>${k}</b><span>${f(x.p)}</span><small>${PH.filter(p=>p.brand===k&&p.flagship).length} флагмана</small></button>`).join('')}</div><div class="dropzone" style="--pc:${c.c}"><div class="dropbox" id="dropbox">${phoneCase.toUpperCase()}</div><div class="dropresult" id="dropresult"></div></div><button class="go" data-a="open-phone-case"><span>Открыть кейс ${phoneCase}</span><small>${f(c.p)}</small></button>`},
numbers(){const c=CS[ck];return head()+`<div class="eb">УНИКАЛЬНЫЕ SIM</div><div class="hd"><h1>Номера</h1><div class="bdg">+7</div></div>
<div class="seg"><button data-a="m" data-m="gen" class="${mode=='gen'?'on':''}">Генерация</button><button data-a="m" data-m="mine" class="${mode=='mine'?'on':''}">Мои номера <b>${S.nums.length}</b></button></div>
${mode=='gen'?`<p class="sub" style="margin:0">Выбери класс кейса. Продажа игре возвращает только часть стоимости — лучшие номера выгоднее хранить.</p>
<div class="cs3">${Object.entries(CS).map(([k,x])=>`<button class="cs ${k==ck?'on':''}" data-a="c" data-k="${k}" style="--c1:${x.c[0]};--c2:${x.c[1]};--c3:${x.c[2]}"><b>${x.n}</b><strong>${f(x.p)}</strong><small>${x.d}</small></button>`).join('')}</div>
<div class="sim" id="sim"><div class="sr"><span>VIRAL SIM</span><span>${c.k}</span></div><div class="chip"></div><div class="num idle" id="nu">+7 XXX XXX XX XX</div><div class="sf"><span id="rl">ГОТОВ К ГЕНЕРАЦИИ</span><span id="ev"></span></div><div class="bar"><i id="br"></i></div></div>
<button class="go" data-a="gen" id="gb"><span>${last?'Сгенерировать ещё':'Сгенерировать номер'}</span><small>${f(c.p)}</small></button>
<div class="note">Выкуп игрой: 40% оценочной стоимости · номер возвращается в оборот</div>`:
`<div class="sub" style="margin:0 0 4px">${S.nums.length} / 5 номеров</div>${S.nums.length?S.nums.map((n,i)=>`<div class="card row"><div><b style="font-size:17px">${fmt(n.d)}</b><div style="font-size:11px;font-weight:800;color:${RR[n.r][1]};margin-top:4px">${RR[n.r][0].toUpperCase()} · ${f(n.v)}</div></div><button class="pill" data-a="sell" data-i="${i}">Продать<br><small>${f(n.v*.4)}</small></button></div>`).join(''):'<div class="card sub">Открой первый кейс с номером</div>'}`}`},
profile(){return head()+`<div class="eb">ПРОФИЛЬ</div><div class="hd"><h1>${S.name||'Новый автор'}</h1></div><div class="grid2"><div class="st"><span>Подписчики</span><b>${f2(S.subs)}</b></div><div class="st"><span>Лайки</span><b>${f2(S.likes)}</b></div></div><div class="card"><span style="font-size:11px;color:var(--mut)">Состояние</span><b style="display:block;font-size:26px">${f(S.cash)}</b></div><div class="card sub" style="margin-top:12px">Продвижение: убывающая эффективность — чем больше подписчиков, тем сложнее расти.</div><button class="go" data-a="reset" style="background:#1d1b27;box-shadow:none;border:1px solid var(--ln)"><span>Начать заново</span><small>↻</small></button>`}};
const f2=n=>Math.round(n).toLocaleString('ru-RU');
const fmt=s=>'+7 '+s.slice(0,3)+' '+s.slice(3,6)+' '+s.slice(6,8)+' '+s.slice(8);
function draw(){$('#vw').innerHTML=V[tab]();$('#vw').scrollTop=0;
